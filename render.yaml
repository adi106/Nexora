databases:
  - name: nexora-db
    databaseName: nexora
    user: nexora
    plan: free

services:
  - type: web
    name: nexora-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nexora-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: RESERVATION_EXPIRY_MINUTES
        value: "15"
      # Optional: enables the AI shopping assistant. Add your key in the
      # Render dashboard after the first deploy — see README for details.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: FRONTEND_HOST
        fromService:
          name: nexora-frontend
          type: web
          property: host
    # Render's Postgres connection string uses the postgres:// scheme; the
    # app expects postgresql+psycopg://, and CORS_ORIGINS needs the
    # frontend's actual assigned URL, so both are resolved at container
    # start rather than as static config.
    dockerCommand: >-
      sh -c "export DATABASE_URL=$(echo \"$DATABASE_URL\" | sed -E 's#^postgres(ql)?://#postgresql+psycopg://#') &&
      export CORS_ORIGINS=\"https://${FRONTEND_HOST},http://localhost:5173\" &&
      alembic upgrade head &&
      uvicorn backend.app.main:app --host 0.0.0.0 --port \"$PORT\""

  - type: web
    name: nexora-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && VITE_API_BASE_URL="https://${BACKEND_HOST}/api/v1" npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: BACKEND_HOST
        fromService:
          name: nexora-backend
          type: web
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
