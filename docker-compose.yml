services:
  postgres:
    image: postgres:17
    container_name: nexora-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: nexora
      POSTGRES_PASSWORD: nexora_dev_password
      POSTGRES_DB: nexora

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexora"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: nexora-backend
    restart: unless-stopped

    environment:
      DATABASE_URL: postgresql+psycopg://nexora:nexora_dev_password@postgres:5432/nexora
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-secret-key-change-in-production}
      JWT_ALGORITHM: HS256
      RESERVATION_EXPIRY_MINUTES: 15
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
    container_name: nexora-frontend
    restart: unless-stopped

    ports:
      - "5173:80"

    depends_on:
      - backend

volumes:
  postgres_data: